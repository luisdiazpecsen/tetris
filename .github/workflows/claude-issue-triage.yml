name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repositorio: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Evento: ${{ github.event.action }}

            Eres el responsable de triage de issues de este proyecto (Tetris en HTML/CSS/JS
            vanilla; la lógica está en `game.js` y la interfaz en `index.html`). Sigue
            estos pasos:

            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --comments`
               y revisa el código relevante del repositorio (`game.js`, `index.html`,
               `CLAUDE.md`) para fundamentar el análisis.

            2. Ejecuta `gh label list` y asigna los labels apropiados con
               `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               Usa solo labels que ya existan (por ejemplo tipo: bug, enhancement,
               question, documentation; y área si existe alguno). Si el issue se editó
               y algún label asignado antes ya no aplica, quítalo con `--remove-label`.

            3. Publica un diagnóstico general en un comentario, en español, que empiece
               con la línea oculta `<!-- claude-triage -->` y contenga:
               - **Resumen** del problema o solicitud.
               - **Tipo** (bug, mejora, pregunta, etc.) y severidad estimada.
               - **Causa probable** y/o **área afectada**, citando archivos y funciones
                 concretas (p. ej. `rotateCW`, `lockPiece`, `clearLines`).
               - **Propuesta de solución** paso a paso, pensada para que luego se pueda
                 implementar el código.
               - **Criterios de aceptación** y cómo verificarlo manualmente.
               - **Información faltante**, si el issue es ambiguo.
               Antes de comentar, busca un comentario existente que contenga
               `<!-- claude-triage -->` (con `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments`).
               Si existe, actualízalo con `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=...`;
               si no, créalo con `gh issue comment`. Nunca dejes comentarios duplicados.

            4. No modifiques archivos del repositorio ni abras pull requests.
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*),Read,Grep,Glob"
